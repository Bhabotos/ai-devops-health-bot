name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: CLI smoke tests
        env:
          TELEGRAM_BOT_TOKEN: dummy
        run: |
          python monitoring/telegram_bot.py --mode cli --text "/help"
          python monitoring/telegram_bot.py --mode cli --text "/health"
          python monitoring/telegram_bot.py --mode cli --text "/status"
          python monitoring/telegram_bot.py --mode cli --text "/actions"
          python monitoring/telegram_bot.py --mode cli --text "/logs 5"
          python monitoring/telegram_bot.py --mode cli --text "/export"
          python monitoring/api.py health --server server1
          python monitoring/api.py allowlist
          python monitoring/api.py export
          python monitoring/api.py retention --keep 20

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ai-devops-command-center:ci-${{ github.sha }} .

      - name: Verify Docker image health endpoint
        run: |
          docker run --rm ai-devops-command-center:ci-${{ github.sha }} python monitoring/api.py health --server server1

      - name: Verify Docker image allowlist endpoint
        run: |
          docker run --rm ai-devops-command-center:ci-${{ github.sha }} python monitoring/api.py allowlist

      - name: Check for Docker Hub secrets
        id: dockerhub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        if: steps.dockerhub.outputs.present == 'true'
        run: |
          docker tag ai-devops-command-center:ci-${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/ai-devops-command-center:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ai-devops-command-center:${{ github.sha }}

  lint:
    name: Lint and Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for secrets in code
        run: |
          echo "Scanning for potential secrets..."
          if grep -rE "(password|secret|token|key|api_key|apikey)\s*=\s*['\"][^'\"]+['\"]" --include="*.py" --include="*.yml" --include="*.yaml" --include="*.json" --include="*.md" .; then
            echo "WARNING: Potential secrets found in code"
            exit 1
          fi
          echo "No secrets detected"

      - name: Verify no Ansible deployment changes
        run: |
          echo "Ensuring core deployment files are untouched..."
          if [ -f web_deploy.yml ]; then
            echo "web_deploy.yml exists and is not modified by CI"
          fi
          if [ -f inventory.ini ]; then
            echo "inventory.ini exists and is not modified by CI"
          fi
          echo "Core deployment files preserved"

  deploy:
    name: Deployment
    runs-on: [self-hosted, linux]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [test, docker, lint]
    env:
      KEY_PATH: ${{ github.workspace }}/deploy_key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.18,<3"

      - name: Install SSH key
        if: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          install -m 600 /dev/null "$KEY_PATH"
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > "$KEY_PATH"
          echo "SSH key installed."

      - name: Notify Telegram - Deployment started
        if: success() && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text=🚀 Deployment started
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Status: DEPLOYMENT STARTED"

      - name: Deploy web stack via Ansible
        id: deploy
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ env.KEY_PATH }}
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory.ini web_deploy.yml -v

      - name: Notify Telegram - Deployment successful
        if: steps.deploy.outcome == 'success' && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text=✅ Deployment successful
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Status: DEPLOYMENT SUCCESSFUL"

      - name: Notify Telegram - Deployment failed
        if: steps.deploy.outcome == 'failure' && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text=❌ Deployment failed
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Status: DEPLOYMENT FAILED"

      - name: Post-deploy health verification
        id: health
        if: steps.deploy.outcome == 'success'
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ env.KEY_PATH }}
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory.ini monitoring/health.yml

      - name: Notify Telegram - Health check passed
        if: steps.health.outcome == 'success' && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text=✅ Health check passed
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Deployment Status: SUCCESSFUL
          Health Check Status: PASSED"

      - name: Notify Telegram - Health check failed
        if: steps.health.outcome == 'failure' && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text=❌ Health check failed
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Deployment Status: SUCCESSFUL
          Health Check Status: FAILED"

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f "$KEY_PATH"
          echo "SSH key removed."

  notify-ci-started:
    name: Notify Telegram - CI started
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Notify
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text=🔔 CI started
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Status: CI STARTED"

  notify-ci-passed:
    name: Notify Telegram - CI passed
    runs-on: ubuntu-latest
    needs: [test, docker, lint]
    if: success()
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Notify
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text=✅ CI passed
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Status: CI PASSED"

  notify-ci-failed:
    name: Notify Telegram - CI failed
    runs-on: ubuntu-latest
    needs: [test, docker, lint]
    if: failure()
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Notify
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text=❌ CI failed
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Status: CI FAILED"
